<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معدلات التشغيل — نظام إدارة الإنتاج</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <main class="main">
      <div class="topbar">
        <h1>معدلات التشغيل لكل صنف</h1>
        <div class="meta">زمن الوحدة وطاقة الوردية لكل عملية — أساس حساب الماكينات والعمالة</div>
      </div>

      <div id="msgBox"></div>

      <div class="panel">
        <h2>اختر الصنف</h2>
        <select id="itemSelect" style="max-width:520px;"></select>
      </div>

      <div class="panel" id="weightPanel" style="display:none;">
        <h2>وزن الوحدة <span>لحساب معدل الإنتاج بالطن وإنتاجية العمالة (كجم/ساعة)</span></h2>
        <div class="field" style="max-width:220px;">
          <label>وزن الوحدة (كجم)</label>
          <input type="number" step="0.001" id="itemWeight">
        </div>
        <button class="btn" id="saveWeightBtn">حفظ الوزن</button>
      </div>

      <div class="panel" id="ratesPanel" style="display:none;">
        <h2>عمليات <span id="familyLabel"></span></h2>
        <table>
          <thead><tr><th>الترتيب</th><th>اسم العملية</th><th>زمن الوحدة (ساعة)</th><th>طاقة الوردية (وحدة)</th></tr></thead>
          <tbody id="ratesBody"></tbody>
        </table>
        <div style="margin-top:16px;">
          <button class="btn" id="saveRatesBtn">حفظ المعدلات</button>
        </div>
      </div>
    </main>
    <nav class="sidebar" id="sidebar"></nav>
  </div>

  <script type="module" src="js/rates.js"></script>
</body>
</html>
