<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — نظام إدارة الإنتاج</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="center-card">
    <h1>تسجيل الدخول</h1>
    <div id="msgBox"></div>
    <form id="loginForm">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="password" required>
      </div>
      <button class="btn" type="submit" style="width:100%;">دخول</button>
    </form>
    <p style="text-align:center;margin-top:16px;"><a href="index.html" style="color:var(--text-dim);font-size:13px;">رجوع للوحة المتابعة</a></p>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
