<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخطة الأسبوعية — نظام إدارة الإنتاج</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <main class="main">
      <div class="topbar">
        <h1>الخطة الأسبوعية</h1>
        <div class="meta">اختر أسبوع لعرض الكمية المستهدفة فيه لكل صنف</div>
      </div>

      <div style="display:flex; gap:10px; margin-bottom:16px;">
        <button class="btn week-btn" data-week="1">أسبوع 1</button>
        <button class="btn secondary week-btn" data-week="2">أسبوع 2</button>
        <button class="btn secondary week-btn" data-week="3">أسبوع 3</button>
        <button class="btn secondary week-btn" data-week="4">أسبوع 4</button>
      </div>

      <div class="panel">
        <h2>خطة <span id="weeklyTitle">الأسبوع 1</span></h2>
        <table>
          <thead><tr><th>الكود</th><th>الوصف</th><th>العيلة</th><th>الكمية المستهدفة</th></tr></thead>
          <tbody id="weeklyBody"><tr><td colspan="4" class="empty">جارِ التحميل...</td></tr></tbody>
        </table>
      </div>
    </main>
    <nav class="sidebar" id="sidebar"></nav>
  </div>

  <script type="module" src="js/weekly-plan.js"></script>
</body>
</html>
